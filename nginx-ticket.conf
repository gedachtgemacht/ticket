server {
    server_name ticket.example.com;

    # Anmeldung macht die App selbst (eigene Konten); Bericht- und Webhook-Links brauchen keinen nginx-Login.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8909;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types application/json text/html;
    gzip_min_length 1024;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ticket.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticket.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name ticket.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
