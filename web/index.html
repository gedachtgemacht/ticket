<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>ticket.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232557c7'/%3E%3Crect x='7' y='7' width='5' height='18' rx='2' fill='%23fff'/%3E%3Crect x='14' y='7' width='5' height='12' rx='2' fill='%23fff' opacity='.8'/%3E%3Crect x='21' y='7' width='4' height='8' rx='2' fill='%23fff' opacity='.6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f8; --surface:#eceef0; --card:#ffffff;
  --line:#d9dce0; --line-strong:#80878f;
  --fg:#1b1d20; --fg-2:#50565e; --fg-3:#656c75;
  --accent:#2557c7; --accent-fg:#ffffff; --accent-bg:#e4ecfb;
  --danger:#b3261e; --danger-bg:#fbe9e7; --danger-on:#ffffff;
  --hover:rgba(27,29,32,.06); --overlay:rgba(16,18,22,.48);
  --l-grau-bg:#e3e5e8; --l-grau-fg:#3b4047;
  --l-blau-bg:#dbe6fb; --l-blau-fg:#1d3f8f;
  --l-gruen-bg:#d8eedf; --l-gruen-fg:#1d5a33;
  --l-gelb-bg:#f6ebc3; --l-gelb-fg:#5c4600;
  --l-rot-bg:#f7dcda; --l-rot-fg:#8a1c15;
  --l-lila-bg:#e8def7; --l-lila-fg:#4b2a85;
  --sans:system-ui,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --side:252px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111214; --surface:#181a1d; --card:#202327;
    --line:#2b2f34; --line-strong:#6b727b;
    --fg:#e8eaed; --fg-2:#a9afb7; --fg-3:#8a919a;
    --accent:#8fb0ff; --accent-fg:#0d1526; --accent-bg:#1b2640;
    --danger:#f2928c; --danger-bg:#3a1f1d; --danger-on:#2b0a08;
    --hover:rgba(232,234,237,.07); --overlay:rgba(0,0,0,.6);
    --l-grau-bg:#33373d; --l-grau-fg:#d5d9de;
    --l-blau-bg:#22345c; --l-blau-fg:#bcd0ff;
    --l-gruen-bg:#1f3d2b; --l-gruen-fg:#b6e3c4;
    --l-gelb-bg:#463a10; --l-gelb-fg:#f0dc9a;
    --l-rot-bg:#4a2220; --l-rot-fg:#f5bcb8;
    --l-lila-bg:#38294f; --l-lila-fg:#d9c8f5;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/20px var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:left}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--fg-2)}
.nowrap{white-space:nowrap}
.small{font-size:12px;line-height:16px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
*{transition:background-color .12s,border-color .12s,color .12s;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
input[type=checkbox]{accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- gerüst ---------- */
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100dvh}
#side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
.offline{background:var(--danger-bg);color:var(--danger);padding:4px 16px;font-size:13px}

/* seitenleiste */
.ws{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px;min-height:48px}
.ws b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.ws small{display:block;font-size:12px;color:var(--fg-2);font-weight:400}
.sbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;color:var(--fg-2)}
@media (hover:hover){.sbtn:hover{background:var(--hover);color:var(--fg)}}
.swrap{flex:1;overflow-y:auto;padding:0 8px 8px}
.finder{display:flex;align-items:center;gap:8px;width:100%;height:32px;margin:0 0 8px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--card);color:var(--fg-2)}
@media (hover:hover){.finder:hover{color:var(--fg)}}
.finder{white-space:nowrap}
.finder kbd{margin-left:auto;font:11px var(--mono);color:var(--fg-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.nav{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:4px 8px;border-radius:6px;color:var(--fg);text-decoration:none;overflow:hidden}
@media (hover:hover){.nav:hover{background:var(--hover)}}
.nav.on{background:var(--accent-bg);color:var(--accent)}
.nav .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.unread .t{font-weight:700}
.nav .sym{width:16px;text-align:center;color:var(--fg-2);flex:none;font-weight:600}
.nav.on .sym{color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:12px;line-height:20px;font-weight:600;text-align:center;flex:none}
.sec{display:flex;align-items:center;justify-content:space-between;margin:12px 0 2px;padding:0 8px;color:var(--fg-2);font-size:12px;font-weight:600}
.sec button{color:var(--fg-2);display:inline-flex;border-radius:4px;padding:2px}
@media (hover:hover){.sec button:hover{background:var(--hover);color:var(--fg)}}
.me{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);width:100%}
@media (hover:hover){.me:hover{background:var(--hover)}}
.me .t{min-width:0}
.me .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .t span{display:block;font-size:12px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* avatar + praesenz */
.av{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--l-grau-bg);color:var(--l-grau-fg);font:600 10px/1 var(--sans);flex:none;letter-spacing:.02em}
.av.lg{width:32px;height:32px;font-size:12px}
.av.xl{width:40px;height:40px;font-size:14px}
.av.leer{background:none;border:1px dashed var(--line-strong);color:transparent}
.pd{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);background:var(--accent)}
.card .pd,.dlg .pd,.pop .pd,.sw .pd{border-color:var(--card)}
.pd.abwesend{background:var(--card);box-shadow:inset 0 0 0 2px var(--fg-2)}
.pd.nicht_stoeren{background:linear-gradient(var(--card),var(--card)) center/5px 2px no-repeat,var(--fg-2)}
.pdl{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.pdl.abwesend{background:transparent;box-shadow:inset 0 0 0 2px var(--fg-2)}
.pdl.nicht_stoeren{background:linear-gradient(var(--card),var(--card)) center/4px 2px no-repeat,var(--fg-2)}

/* kopf */
.head{display:flex;flex-direction:column;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.head .top{display:flex;align-items:center;gap:8px;min-height:32px}
.head h1{font-size:18px;line-height:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .desc{color:var(--fg-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-top:4px}
.tab{padding:6px 10px 7px;color:var(--fg-2);border-bottom:2px solid transparent;font-weight:500;text-decoration:none;white-space:nowrap}
@media (hover:hover){.tab:hover{color:var(--fg)}}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.burger{display:none}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line)}
.filters .sel{max-width:168px;text-overflow:ellipsis}
.sel,.inp{height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--card);padding:0 8px;min-width:0}
textarea.inp{height:auto;padding:6px 8px;resize:vertical;line-height:20px}
.sel.sm{height:28px;font-size:13px}
.inp::placeholder{color:var(--fg-3)}
.chipbtn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border:1px solid var(--line-strong);border-radius:14px;color:var(--fg-2);font-size:13px;white-space:nowrap;text-decoration:none}
@media (hover:hover){.chipbtn:hover{color:var(--fg)}}
.chipbtn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line-strong);font-weight:500;white-space:nowrap}
@media (hover:hover){.btn:hover{background:var(--hover)}}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
@media (hover:hover){.btn.pri:hover{filter:brightness(1.08)}}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.gh{border-color:transparent;color:var(--fg-2)}
@media (hover:hover){.btn.gh:hover{color:var(--fg)}}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn:active{background:var(--line)}
.btn.pri:active{background:var(--accent);filter:brightness(.92)}
.mi:active,.nav:active,.sbtn:active,.add:active{background:var(--line)}
.abtn:active{filter:brightness(.95)}
.tc:active{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.count{margin-left:auto;color:var(--fg-2);font-size:13px}
#view{flex:1;min-height:0;overflow:auto;position:relative}
#view:focus{outline:none}
.skip{position:absolute;left:8px;top:-60px;z-index:100;height:36px;padding:0 12px;border-radius:6px;background:var(--accent);color:var(--accent-fg);font-weight:600}
.skip:focus{top:8px}
.pad{padding:16px;max-width:980px}
.pad.wide{max-width:none}
h2.h{font-size:13px;font-weight:600;margin:20px 0 8px;color:var(--fg-2)}
h2.h:first-child{margin-top:0}
.leer-hinweis{color:var(--fg-2);padding:16px 0}
.leer-hinweis a{cursor:pointer}

/* ---------- board ---------- */
.bw{display:flex;flex-direction:column;height:100%}
.bw .board{flex:1;min-height:0;height:auto}
.seg{display:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(264px,1fr);gap:12px;height:100%;padding:12px 16px 16px;overflow-x:auto;overscroll-behavior-x:contain;align-items:start}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:8px;max-height:100%;min-height:0;border:1px solid transparent}
.list.drop{border-color:var(--accent);background:var(--accent-bg)}
.lh{padding:10px 12px 6px}
.lh .r{display:flex;align-items:center;gap:8px}
.lh h2{font-size:13px;font-weight:600;flex:1}
.lh .n{color:var(--fg-2);font-size:13px}
.lh .hint{font-size:12px;color:var(--fg-2);margin-top:2px}
.lh .hint.warn{color:var(--danger);font-weight:600}
.lb{padding:4px 8px 6px;overflow-y:auto;min-height:12px;display:flex;flex-direction:column;gap:8px;flex:0 1 auto}
.leer-sp{display:flex;flex-direction:column;align-items:center;padding:8px 4px 4px;text-align:center;color:var(--fg-2);font-size:13px}
.leer-sp button:not(.btn){margin-top:4px;color:var(--accent);text-decoration:underline}
.list.drop .leer-sp{display:none}
.lf{padding:4px 8px 8px}
.add{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;border-radius:6px;color:var(--fg-2)}
@media (hover:hover){.add:hover{background:var(--hover);color:var(--fg)}}
.addbox textarea{width:100%;resize:none;border:1px solid var(--accent);border-radius:6px;padding:8px;background:var(--card);min-height:56px;display:block}
.addbox .r{margin-top:6px}
.ph{border:2px dashed var(--accent);border-radius:6px;background:transparent;min-height:40px}
.tc{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px 8px;cursor:pointer;position:relative}
@media (hover:hover){.tc:hover{border-color:var(--line-strong)}}
.tc.sel{border-color:var(--accent);background:var(--accent-bg)}
.tc.dragging{opacity:.4}
.tc .lbls{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tc .ti{font-size:14px;line-height:20px;font-weight:500;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tc.ungel .ti{font-weight:700;padding-right:14px}
.tc.moved{animation:moved .9s ease-out}
@keyframes moved{from{box-shadow:0 0 0 2px var(--accent)}to{box-shadow:0 0 0 2px transparent}}
@media (prefers-reduced-motion:reduce){.tc.moved{animation:none;box-shadow:0 0 0 2px var(--accent)}}
.tc.ungel::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tc.fertig .ti{color:var(--fg-2)}
.tc .bd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:6px}
.tc .nr{font:12px var(--mono);color:var(--fg-2)}
.tc .ft{display:flex;align-items:center;gap:8px;margin-top:6px}
.bg{display:inline-flex;align-items:center;gap:3px;font-size:12px;line-height:16px;color:var(--fg-2);padding:1px 4px;border-radius:4px}
.bg.due.over{background:var(--danger-bg);color:var(--danger);font-weight:600}
.bg.done{background:var(--l-gruen-bg);color:var(--l-gruen-fg)}
.bg.out{border:1px solid var(--line-strong);padding:0 5px}
.bg.out.k{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg.warn{color:var(--danger);font-weight:600}
.lbl{display:inline-block;font-size:12px;line-height:16px;font-weight:500;padding:0 6px;border-radius:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl-grau{background:var(--l-grau-bg);color:var(--l-grau-fg)}
.lbl-blau{background:var(--l-blau-bg);color:var(--l-blau-fg)}
.lbl-gruen{background:var(--l-gruen-bg);color:var(--l-gruen-fg)}
.lbl-gelb{background:var(--l-gelb-bg);color:var(--l-gelb-fg)}
.lbl-rot{background:var(--l-rot-bg);color:var(--l-rot-fg)}
.lbl-lila{background:var(--l-lila-bg);color:var(--l-lila-fg)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--line-strong);font-size:12px;font-weight:600;color:var(--fg);background:var(--card);white-space:nowrap}
@media (hover:hover){button.pill:hover{background:var(--hover)}}
.pill.s-arbeit,.pill.s-review{color:var(--accent);border-color:var(--accent)}
.pill.s-verworfen{color:var(--fg-2)}

/* ---------- listen, zeilen ---------- */
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:12px;color:var(--fg-2);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl th button{font-weight:600;color:inherit;display:inline-flex;gap:4px;align-items:center}
table.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl th{z-index:1}
@media (hover:hover){table.tbl th button:hover{color:var(--fg)}}
table.tbl td:first-child,table.tbl td:nth-child(n+3){white-space:nowrap}
table.tbl td:nth-child(2) .lbl{margin-left:4px;vertical-align:middle;max-width:160px}
table.tbl tr.rw{cursor:pointer}
@media (hover:hover){table.tbl tr.rw:hover td{background:var(--hover)}}
table.tbl tr.rw:focus-visible{outline-offset:-2px}
.trow{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;min-height:36px}
@media (hover:hover){.trow:hover{background:var(--hover)}}
.trow .lbl{flex:0 1 auto;min-width:0}
.trow .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.ungel .ti{font-weight:700}
.trow .nr{font:12px var(--mono);color:var(--fg-2);flex:none}
.group{margin-bottom:16px}
.meld{display:flex;gap:10px;width:100%;padding:8px;border-radius:6px;align-items:flex-start}
@media (hover:hover){.meld:hover{background:var(--hover)}}
.meld.neu .tx{font-weight:600}
.meld .tx{flex:1;min-width:0}
.meld .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.meld .dot.aus{background:transparent}

/* woche */
.week{display:grid;grid-template-columns:repeat(7,minmax(208px,1fr));gap:8px;padding:12px 16px;overflow-x:auto}
.wc{background:var(--surface);border-radius:8px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.wc h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.wc h3 small{font-weight:400;color:var(--fg-2)}
.wc.heute{outline:2px solid var(--accent);outline-offset:-2px}
.wc.ue h3{color:var(--danger)}
.nav-week{display:flex;align-items:center;gap:8px;padding:8px 16px}

/* kennzahlen */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-size:24px;line-height:30px;font-weight:600}
.tile span{color:var(--fg-2);font-size:12px}
.tile.warn b{color:var(--danger)}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:8px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:100%;font-size:11px;color:var(--fg-2)}
.bars .p{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .p i{display:block;width:40%;min-height:1px;border-radius:2px 2px 0 0}
.bars .a{background:var(--accent)}
.bars .b{background:var(--line-strong)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--fg-2);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ---------- dialog (kartenrückseite) ---------- */
.ovl{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.dlg:focus{outline:none}
.dlg{background:var(--bg);border-radius:10px;width:min(1120px,100%);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.28);border:1px solid var(--line)}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dh .nr{font:13px var(--mono);color:var(--fg-2);flex:none}
.dh a.small{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{padding:12px 16px 0}
.dt textarea{width:100%;resize:none;border:1px solid transparent;border-radius:6px;background:transparent;font-size:20px;line-height:28px;font-weight:600;padding:2px 6px;margin:0 -6px;overflow:hidden;display:block}
@media (hover:hover){.dt textarea:hover{border-color:var(--line)}}
.dt textarea:focus{border-color:var(--accent);background:var(--card)}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 168px minmax(300px,390px);gap:16px;padding:12px 16px 16px;align-items:start}
.dl{min-width:0;display:flex;flex-direction:column;gap:16px}
.da{display:flex;flex-direction:column;gap:6px;position:sticky;top:0}
.da h3{font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:2px}
.abtn{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border-radius:6px;background:var(--surface);color:var(--fg);font-weight:500}
@media (hover:hover){.abtn:hover{background:var(--line)}}
.abtn.zu{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:12px 16px}
.chips .g h3{font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:4px}
.chips .g .r{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sbox h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.fgrid label{display:block;font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:2px}
.fgrid .sel,.fgrid .inp{width:100%}
.fgrid .full{grid-column:1/-1}
.chk,.fgrid label.chk{display:flex;align-items:center;gap:8px;min-height:32px;font-size:14px;margin:0}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.hinweis{font-size:12px;color:var(--fg-2);margin-top:4px}
.desc-ta{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--card);line-height:22px}
.desc-ta:focus{border-color:var(--accent)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--accent)}
.cl{margin-bottom:12px}
.cl .ch{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cl .ch b{flex:1;font-weight:600}
.cl .pt{display:flex;align-items:flex-start;gap:8px;padding:3px 4px;border-radius:4px}
@media (hover:hover){.cl .pt:hover{background:var(--hover)}}
.cl .pt input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.cl .pt.done span{text-decoration:line-through;color:var(--fg-2)}
.cl .pt span{flex:1;min-width:0;overflow-wrap:anywhere}
.cl .pt .x{opacity:0}
.cl .pt .x:focus-visible{opacity:1}
@media (hover:hover){.cl .pt:hover .x{opacity:1}}
@media (hover:none){.cl .pt .x{opacity:.7}}
.vk{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:4px}
@media (hover:hover){.vk:hover{background:var(--hover)}}
.vk .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vk .x{opacity:0}
.vk .x:focus-visible{opacity:1}
@media (hover:hover){.vk:hover .x{opacity:1}}
@media (hover:none){.vk .x{opacity:.7}}
.tgl{display:flex;gap:8px}
.tgl .inp{flex:1}

/* thread */
.th{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:360px;max-height:calc(100dvh - 190px);position:sticky;top:0}
.th h3{font-size:13px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.feed{flex:1;overflow-y:auto;padding:4px 0 8px;min-height:120px}
.day{display:flex;align-items:center;gap:8px;margin:12px 12px 4px;color:var(--fg-2);font-size:12px;font-weight:600}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{position:relative;display:flex;gap:8px;padding:4px 12px}
@media (hover:hover){.msg:hover{background:var(--hover)}}
.msg .av{margin-top:2px}
.msg .sp{width:24px;flex:none}
.msg .b{flex:1;min-width:0}
.msg .nm{font-weight:700}
.msg .tm{font-size:12px;color:var(--fg-2);margin-left:6px}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tx .at{background:var(--accent-bg);color:var(--accent);border-radius:3px;padding:0 2px;font-weight:600}
.msg.gelo{color:var(--fg-2);font-size:12px;font-style:italic}
.tools{position:absolute;right:8px;top:-12px;display:none;background:var(--card);border:1px solid var(--line-strong);border-radius:6px;padding:2px;gap:2px}
.msg:focus-within .tools{display:flex}
@media (hover:hover){.msg:hover .tools{display:flex}}
@media (hover:none){.tools{display:flex;position:static;border:0;padding:0;margin-top:2px;background:none}}
.tools button{width:28px;height:28px;display:grid;place-items:center;border-radius:4px;color:var(--fg-2)}
@media (hover:hover){.tools button:hover{background:var(--hover);color:var(--fg)}}
.react{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px}
@media (hover:hover){.rx:hover{border-color:var(--line-strong)}}
.rx.mine{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.ev{display:flex;align-items:baseline;gap:8px;padding:2px 12px 2px 20px;color:var(--fg-2);font-size:12px;line-height:18px}
.ev::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line-strong);flex:none;transform:translateY(-1px);margin-left:3px}
.ev .tm{margin-left:auto;white-space:nowrap}
.ev .grow{overflow-wrap:anywhere}
.ev b{font-weight:600;color:var(--fg)}
.cmp{border-top:1px solid var(--line);padding:8px 12px 12px;position:relative}
.cmp .box{display:flex;align-items:flex-end;gap:4px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);padding:4px 4px 4px 8px}
.cmp .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cmp textarea{flex:1;border:0;outline:0;resize:none;background:none;min-height:28px;max-height:140px;padding:4px 0;line-height:20px}
.cmp .hintz{font-size:11px;color:var(--fg-2);margin-top:4px}
.ac{position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);background:var(--card);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:4px;z-index:5;max-height:220px;overflow:auto}
.ac button{display:flex;align-items:center;gap:8px;width:100%;padding:4px 8px;border-radius:4px}
.ac button.on{background:var(--accent-bg)}
@media (hover:hover){.ac button:hover{background:var(--accent-bg)}}
.ac .em{margin-left:auto;color:var(--fg-2);font-size:12px}

/* popover, menu */
.pop{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:8px;min-width:220px;max-width:min(340px,calc(100vw - 16px));max-height:min(560px,calc(100dvh - 16px));overflow:auto}
.pop h4{font-size:12px;font-weight:600;color:var(--fg-2);padding:2px 4px 6px;display:flex;justify-content:space-between;align-items:center}
.mi{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:4px 8px;border-radius:6px}
.mi:focus-visible{background:var(--hover)}
@media (hover:hover){.mi:hover{background:var(--hover)}}
.mi.on{background:var(--accent-bg);color:var(--accent)}
.mi.dng{color:var(--danger)}
.mi .em{margin-left:auto;color:var(--fg-2);font-size:12px}
.hr{height:1px;background:var(--line);margin:4px 0}
.emo{display:flex;gap:4px;padding:2px}
.emo button{width:36px;height:36px;font-size:18px;text-align:center;border-radius:6px}
.emo button.on{background:var(--accent-bg)}
@media (hover:hover){.emo button:hover{background:var(--accent-bg)}}
.lrow{display:flex;align-items:center;gap:8px;padding:2px 0}
.lrow label{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.lrow .lbl{flex:1;padding:4px 8px;font-size:13px}
.farben{display:flex;gap:6px;margin-top:6px}
.farben button{width:24px;height:24px;border-radius:12px;border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.farben button.on{border-color:var(--fg)}
.sw{padding:0}

/* schalter, toast, modal */
.mdl{background:var(--card);border-radius:10px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.28);padding:16px;width:min(460px,100%);margin:auto}
.mdl h2{font-size:16px;line-height:24px;margin-bottom:8px}
.mdl .r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mdl label{display:block;font-size:12px;font-weight:600;color:var(--fg-2);margin:8px 0 2px}
.mdl .inp,.mdl .sel{width:100%}
.ovl.mid{align-items:center}
.sw-in{width:min(560px,100%);margin:8vh auto auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.28);overflow:hidden}
.sw-in input{width:100%;height:44px;border:0;border-bottom:1px solid var(--line);padding:0 16px;font-size:16px;background:none;outline:0}
.sw-res{max-height:55vh;overflow:auto;padding:4px}
.sw-res h4{font-size:12px;color:var(--fg-2);padding:8px 8px 2px;font-weight:600}
.sw-res .mi.on{background:var(--accent-bg)}
.sw-help{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-2)}
.sw-help code{font-family:var(--mono);background:var(--surface);padding:0 4px;border-radius:3px}
#toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast button{color:var(--bg);text-decoration:underline;font-weight:600}
.toast.err{background:var(--danger);color:var(--danger-on)}
.toast.err button{color:var(--danger-on)}
kbd{font:12px var(--mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:8px}

/* anmeldung */
.auth{min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--bg);overflow:auto}
.auth .wrap{width:min(380px,100%);display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.brand svg{width:28px;height:28px}
.auth form,.auth .card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:8px}
.auth h1{font-size:22px;font-weight:600;margin-bottom:4px}
.auth label{font-size:12px;font-weight:600;color:var(--fg-2);margin-top:4px}
.auth .inp{height:40px;font-size:16px}
.auth .btn{height:40px;justify-content:center;margin-top:8px}
.err{color:var(--danger);font-size:13px;min-height:18px}
.copy{display:flex;gap:8px;align-items:center}
.copy input{flex:1;font:12px var(--mono)}

/* admin */
table.adm{width:100%;border-collapse:collapse}
table.adm td,table.adm th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.adm th{font-size:12px;color:var(--fg-2);font-weight:600}
.sett{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:8px 16px;align-items:center;max-width:820px}
.sett input[type=checkbox]{justify-self:start;width:16px;height:16px}
.sett label{font-weight:500}

/* ---------- schmal ---------- */
.scrim{display:none}
@media (max-width:1100px){
  .dg{grid-template-columns:minmax(0,1fr) minmax(280px,360px)}
  .da{grid-column:1/2;grid-row:2;position:static;flex-direction:row;flex-wrap:wrap}
  .da h3{width:100%}
  .abtn{width:auto;flex:none}
  .abtn.zu{margin-top:0}
  .dl{grid-column:1/2;grid-row:3}
  .th{grid-column:2/3;grid-row:2/4}
}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:45;transform:translateX(-102%);box-shadow:4px 0 24px rgba(0,0,0,.25)}
  #side:not(.open){visibility:hidden}
  #side.open{transform:none}
  #side.open + .scrim,.scrim.on{display:block;position:fixed;inset:0;background:var(--overlay);z-index:44}
  .burger{display:inline-flex}
  .board{grid-auto-columns:minmax(84vw,1fr);scroll-snap-type:x mandatory;padding-left:8px;padding-right:8px;scroll-padding:0 8px}
  .list{scroll-snap-align:center}
  .seg{display:flex;flex:none;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:0 4px}
  .seg button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 12px;color:var(--fg-2);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
  .seg button[aria-current=true]{color:var(--accent);border-bottom-color:var(--accent)}
  .seg .n{font-size:12px;font-weight:600}
  .week{grid-template-columns:repeat(7,82vw)}
  .head{padding:8px 12px 0}
  .head .desc{white-space:normal}
  .filters{padding:8px 12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .filters>*{flex:none}
  .filters .count{order:-1;margin:0 4px 0 0}
  .pad{padding:12px 12px 88px}
  .ovl{padding:0}
  .dlg{border-radius:0;min-height:100dvh;border:0}
  .dh{flex-wrap:nowrap;position:sticky;top:0;z-index:3;background:var(--bg)}
  .dg{grid-template-columns:minmax(0,1fr)}
  .da,.dl,.th{grid-column:1;grid-row:auto}
  .da{order:-1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .da h3{display:none}
  .th{position:static;max-height:none;min-height:0}
  .feed{max-height:none;overflow:visible}
  .fgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .sel,.inp,.btn,.chipbtn{min-height:40px}
  .sel.sm,.btn.sm{min-height:36px}
  .abtn{height:40px;white-space:nowrap}
  .sbtn{width:40px;height:40px}
  .nav,.mi{min-height:44px}
  .tab{padding:10px 12px}
  .chk,.fgrid label.chk{min-height:40px}
  .cl .pt,.vk{padding:6px 4px}
  input,select,textarea{font-size:16px}
  .fab{display:flex!important}
  table.tbl thead{display:none}
  table.tbl,table.tbl tbody{display:block;width:100%}
  table.tbl tr.rw{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 4px 10px 80px;border-bottom:1px solid var(--line)}
  table.tbl td{display:block;border:0;padding:0}
  table.tbl td:first-child{position:absolute;left:4px;top:12px;width:68px}
  table.tbl td:nth-child(2){flex:1 1 100%;min-width:0;white-space:normal}
  table.tbl .c-lo,table.tbl .c-leer,table.tbl .c-zeit{display:none}
  .sett{grid-template-columns:minmax(0,1fr)}
  .trow .lbl{display:none}
  table.adm thead{display:none}
  table.adm,table.adm tbody{display:block;width:100%}
  table.adm tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
  table.adm td{display:block;border:0;padding:0}
  table.adm td:first-child{flex:1 1 100%}
}
.fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:26px;background:var(--accent);color:var(--accent-fg);align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:30}
.fab svg.i{width:22px;height:22px}
</style>

/* ============ Schnellwechsler (Strg+K) ============ */

      try {
        const r = await api("GET", "/api/suche?archiv=1&limit=8&q=" + encodeURIComponent(q));
        if (ich !== zaehler) return;
        r.tickets.forEach(t => liste.push({ gruppe: "Tickets", icon: statusIcon(t.status), text: `${t.id}  ${t.titel}`, sub: STATUS_NAME[t.status], fn: () => openTicket(t.nr) }));
      } catch (e) { /* offline */ }
